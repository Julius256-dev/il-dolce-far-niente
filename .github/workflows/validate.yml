name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/il-dolce-far-niente
      - name: Static contract, routing, transform, hook and installer tests
        run: npm run check
      - name: Type check
        run: npm run typecheck
      - name: Packed installer smoke test
        run: npm run test:package
      - name: Validate the Claude Code plugin and marketplace
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate ./plugin --strict
          claude plugin validate .
