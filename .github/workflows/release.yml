name: Release

# Publishes when a new version reaches main. Bump it with
# `npm run release:version -- <x.y.z>`, add the CHANGELOG section, and merge the
# pull request: if that version is not on npm yet, this workflow checks that
# every channel agrees, reruns the checks, publishes to npm with provenance,
# then creates the v<x.y.z> tag and GitHub release from the changelog section.
#
# - npm: `il-dolce-far-niente`. Needs the NPM_TOKEN repository secret.
# - Claude Code, Codex and Copilot plugins read this repository's marketplaces,
#   and skills.sh reads the repository, so the version on main is their release.
#
# A push to main whose version is already on npm does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Is this version new?
        id: version
        run: |
          version="$(node -p "require('./packages/il-dolce-far-niente/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "il-dolce-far-niente@$version" version >/dev/null 2>&1; then
            echo "il-dolce-far-niente@$version is already on npm; nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: npm ci
      - if: steps.version.outputs.new == 'true'
        run: npm ci --prefix packages/il-dolce-far-niente
      - name: Versions and changelog agree
        if: steps.version.outputs.new == 'true'
        run: npx tsx scripts/release-version.ts --check "v${{ steps.version.outputs.version }}"
      - name: Full check
        if: steps.version.outputs.new == 'true'
        run: |
          npm run check
          npm run typecheck
          npm run test:package
          npx tsx scripts/check-discovery.ts
      - name: Validate plugins
        if: steps.version.outputs.new == 'true'
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate ./plugin --strict
          claude plugin validate .
      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        working-directory: packages/il-dolce-far-niente
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag and GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "([[:space:]]|$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md
